<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inscrição para a Banda da Escola</title>
</head>
<body>
    <form action="https://formspree.io/f/xrpeebnl" method="post">
        <h1>🎸Teste para a Banda</h1>
        <label for="">Seu nome:</label>
        <input type="text" id="nome" name= "nome" placeholder="Ex: João Augusto">

        <label for="">Idade:</label>
        <input type="number" id="idade" name="idade" placeholder="Ex: 16">

        <label for="">Qual instrumento você toca?</label>
        <input type="text" id="instrumento" name="instrumento" placeholder="Ex: Piano, Bateria, Canto">
        
        <button type="submit"> Garantir meu teste! 🎶</button>
    </form>
</body>
</html>
